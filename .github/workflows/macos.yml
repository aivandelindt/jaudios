# macOS / Apple Silicon is the product target (AGENTS.md). The macos job builds and tests JAudios on
# a GitHub-hosted arm64 Mac so every PR is checked on the real platform, including the CoreML
# execution provider and the app bundle layout.
#
# The stem model (HT-Demucs, 174 MB) is exported on the Mac itself, parity-checked against PyTorch,
# and the C++ separator is golden-tested against upstream demucs there (jaudios_stems_tests).
#
# The key model is exported once on Linux (parity-checked; it carries a provenance record because
# exports are not byte-identical across machines) and handed to the macOS job, which also exports
# its own and proves the app accepts it.
name: macOS (Apple Silicon)

on:
  push:
    branches: [main]
    tags: ["v*"]   # a release: the DMG is attached to a GitHub release (job "release")
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  ML_VENV: ${{ github.workspace }}/../jaudios-ml-venv

jobs:
  model:
    name: Export key model (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ML env
        uses: actions/cache@v4
        with:
          path: ${{ env.ML_VENV }}
          key: ml-venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/manifest.json') }}

      - name: ML env (pins from models/manifest.json)
        run: |
          [ -x "$ML_VENV/bin/python" ] || python3.12 -m venv "$ML_VENV"
          PINS=$(python3 -c "import json; m=json.load(open('models/manifest.json')); p={**m['openkeyscan_sidecar']['build']['pins'], **m['openkeyscan3_onnx']['export']['pins']}; print(' '.join(f'{k}=={v}' for k,v in p.items() if k not in ('python','pyinstaller','pyinstaller-hooks-contrib')))")
          "$ML_VENV/bin/pip" install -q $PINS tqdm

      - name: Linux build deps for the fixture renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev

      - name: Render fixtures (needed by the parity check)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJAUDIOS_BUILD_TESTS=OFF -DJAUDIOS_BUILD_APP=OFF
          cmake --build build --target fixtures

      - name: Export + parity (+ provenance record)
        env:
          PYTHONFAULTHANDLER: "1"
        run: python3 tools/models.py --only onnx --python "$ML_VENV/bin/python"

      - uses: actions/upload-artifact@v4
        with:
          name: openkeyscan3-onnx
          path: |
            build/models/openkeyscan3.onnx
            build/models/openkeyscan3.onnx.provenance.json
          if-no-files-found: error

  macos:
    name: Build + test (macos-15, arm64)
    needs: model
    runs-on: macos-15 # arm64 (Apple Silicon)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          cmake --version
          brew install ninja

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ML env
        uses: actions/cache@v4
        with:
          path: ${{ env.ML_VENV }}
          key: ml-venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/manifest.json') }}

      - name: ML env (pins from models/manifest.json)
        run: |
          [ -x "$ML_VENV/bin/python" ] || python3.12 -m venv "$ML_VENV"
          PINS=$(python3 -c "import json; m=json.load(open('models/manifest.json')); p={**m['openkeyscan_sidecar']['build']['pins'], **m['openkeyscan3_onnx']['export']['pins']}; print(' '.join(f'{k}=={v}' for k,v in p.items() if k not in ('python','pyinstaller','pyinstaller-hooks-contrib')))")
          "$ML_VENV/bin/pip" install -q $PINS tqdm
          # demucs and its import-time deps without their other requirements (torchaudio, dora, ...),
          # which would replace the pinned torch
          DEMUCS=$(python3 -c "import json; p=json.load(open('models/manifest.json'))['htdemucs_onnx']['export']['pins']; print(' '.join(f'{k}=={p[k]}' for k in ('demucs','einops','julius','pyyaml')))")
          "$ML_VENV/bin/pip" install -q --no-deps $DEMUCS
          # basic-pitch's reference pipeline (no TensorFlow: it runs upstream's nmp.onnx on onnxruntime)
          BP=$(python3 -c "import json; p=json.load(open('models/manifest.json'))['basic_pitch_onnx']['reference_pins']; print(' '.join(f'{k}=={v}' for k,v in p.items()))")
          "$ML_VENV/bin/pip" install -q --no-deps $BP

      - name: Configure (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJAUDIOS_ML_PYTHON="$ML_VENV/bin/python"

      - name: Build
        run: cmake --build build

      - name: Render fixtures
        run: cmake --build build --target fixtures

      - name: Key model from the Linux job
        uses: actions/download-artifact@v4
        with:
          name: openkeyscan3-onnx
          path: build/models

      - name: Verify model (manifest sha256 or verified provenance)
        run: python3 tools/models.py --only onnx

      - name: Audio-to-MIDI model (upstream Basic Pitch nmp.onnx, sha256-pinned)
        run: python3 tools/models.py --only basic_pitch

      - name: Stem model (export HT-Demucs on macOS + parity vs PyTorch)
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python3 tools/models.py --only demucs --python "$ML_VENV/bin/python"
          cat build/models/htdemucs.onnx.provenance.json

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: App bundle layout
        run: |
          APP=build/app/JAudios_artefacts/Release/JAudios.app
          ls -la "$APP/Contents/MacOS" "$APP/Contents/Frameworks"
          otool -L "$APP/Contents/MacOS/JAudios" | grep -i onnxruntime
          otool -l "$APP/Contents/MacOS/JAudios" | grep -A2 LC_RPATH
          codesign --verify --verbose "$APP" || true # linker ad-hoc signature; Developer ID signing is packaging's job

      - name: CLI on the fixture (default backend, debug log)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          JAUDIOS_LOG_LEVEL=debug "$CLI" analyze tests/fixtures/house_124_Amin.wav
          KEY_BACKEND=chroma "$CLI" analyze tests/fixtures/house_124_Amin.wav | head -40

      - name: Stem separation of a 3-minute track (skill target < 60 s on M-series)
        run: |
          "$ML_VENV/bin/python" -c "import numpy as np, soundfile as sf; w=[sf.read(f'tests/fixtures/{n}.wav', dtype='float32')[0] for n in ('house_124_Amin','pop_100_Cmaj','techno_132_Fmin')]; sf.write('$RUNNER_TEMP/three_min.wav', np.concatenate(w)[:180*44100], 44100, subtype='FLOAT')"
          sysctl -n machdep.cpu.brand_string hw.physicalcpu hw.memsize
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          JAUDIOS_LOG_LEVEL=debug "$CLI" separate "$RUNNER_TEMP/three_min.wav" --no-cache --out "$RUNNER_TEMP/stems" | tee "$RUNNER_TEMP/sep.json"
          python3 - "$RUNNER_TEMP/sep.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"{d['duration_sec']:.0f} s track: {d['segments']} segments in {d['separate_sec']:.1f} s on {d['execution_provider']}, null {d['null_residual_dbfs']:.1f} dBFS")
          if d['separate_sec'] >= 60:
              print(f"::warning::3-minute separation took {d['separate_sec']:.0f} s (target < 60 s on an M-series Mac; GitHub's runner is a 3-core M1 VM)")
          sys.exit(0 if d['null_residual_dbfs'] < -40 else 1)
          PY

      - name: Audio to MIDI on the fixtures (mix, and the bass stem from the stem cache)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" transcribe tests/fixtures/melody_mono_Emin.wav --out "$RUNNER_TEMP/melody.mid" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: d[k] for k in ('note_count','pitch_range','mean_confidence','quantize','transcribe_sec')})"
          "$CLI" transcribe tests/fixtures/loop_8bar_Gmaj.wav --stem bass --out "$RUNNER_TEMP/loop.bass.mid" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: d[k] for k in ('separation','monophonic','note_count','pitch_range','transcribe_sec')})"
          ls -la "$RUNNER_TEMP"/*.mid

      - name: Chord suggestions on the fixtures (top-1 vs truth)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          for f in pop_100_Cmaj house_124_Amin techno_132_Fmin loop_8bar_Gmaj; do
            "$CLI" chords "tests/fixtures/$f.wav" --out "$RUNNER_TEMP/$f.chords.mid" | python3 -c "import json,sys; d=json.load(sys.stdin); p=d['progressions'][0]; print('$f', d['key'], '|', p['summary'], '|', ' '.join(p['chords'][:4]), '| engine', round(d['engine_ms'],1), 'ms')"
          done

      - name: Bass and drum patterns against their schemas
        run: python3 tools/validate_patterns.py

      - name: Basslines on the fixtures
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" bass --list-patterns | python3 -c "import json,sys; print([p['name'] for p in json.load(sys.stdin)['patterns']])"
          for a in "house_124_Amin house" "techno_132_Fmin techno" "pop_100_Cmaj pop" "loop_8bar_Gmaj lofi"; do
            set -- $a
            "$CLI" bass "tests/fixtures/$1.wav" --style "$2" --out "$RUNNER_TEMP/$1.bass.mid" | python3 -c "import json,sys; d=json.load(sys.stdin); print('$1', d['progression'], d['pattern'], 'notes', d['note_count'], 'kicks', d['kicks'], 'sidechain', d['sidechain_notes'])"
          done

      - name: Drums on the fixtures (kicks on the detected downbeats; full + per-element export)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" drums --list-patterns | python3 -c "import json,sys; print([p['name'] for p in json.load(sys.stdin)['patterns']])"
          for a in "house_124_Amin house" "techno_132_Fmin techno" "pop_100_Cmaj pop" "loop_8bar_Gmaj lofi"; do
            set -- $a
            "$CLI" drums "tests/fixtures/$1.wav" --style "$2" --split --out "$RUNNER_TEMP/drums-$1" | python3 -c "import json,sys; d=json.load(sys.stdin); print('$1', d['pattern'], 'bars', d['bars'], 'kick error', d['kick_downbeat_max_error_ms'], 'ms', [f['stem'] for f in d['files']]); sys.exit(0 if d['kick_downbeat_max_error_ms'] < 5 else 1)"
          done

      - name: Audition (generated chords + bass + drums on the built-in instruments, through the engine graph)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" audition --list-presets | python3 -c "import json,sys; print([(c['category'], [p['id'] for p in c['presets']]) for c in json.load(sys.stdin)['categories']])"
          "$CLI" audition tests/fixtures/house_124_Amin.wav --style house --out "$RUNNER_TEMP/house.audition.wav" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['progression'], d['chords_instrument']['name'], d['bass_instrument']['name'], d['drums'], d['notes'], 'x%.0f realtime' % d['realtime_factor'], 'peak %.2f' % d['peak']); sys.exit(0 if 0.05 < d['peak'] < 1.0 else 1)"
          "$CLI" audition tests/fixtures/house_124_Amin.wav --bypass --out "$RUNNER_TEMP/house.bypass.wav" | python3 -c "import json,sys; d=json.load(sys.stdin); print('bypass peak %.3f' % d['peak']); sys.exit(0 if d['peak'] < 0.5 else 1)"

      - name: Insert FX (ducking keyed by the drums, tempo-synced delay, reverb, OTT) in the engine graph
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" audition --list-fx | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['parameters']), 'parameters on', d['channels'])"
          "$CLI" audition tests/fixtures/house_124_Amin.wav --style house \
              --fx bass.duck_on=on --fx bass.duck_depth=0.9 --fx chords.reverb_on=on --fx chords.delay_on=on \
              --fx "chords.delay_division=1/8 dotted" --fx drums.ott_on=on --fx drums.sat_on=on --out "$RUNNER_TEMP/house.fx.wav" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['fx'], 'bpm %.1f' % d['bpm'], 'x%.0f realtime' % d['realtime_factor'], 'peak %.2f' % d['peak']); sys.exit(0 if 0.05 < d['peak'] < 1.0 else 1)"

      - name: Export (bar-aligned WAV + MIDI for a DAW, project file), also for a song starting on a pickup
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" export tests/fixtures/house_124_Amin.wav --style house --fx chords.reverb_on=on --out "$RUNNER_TEMP/export" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['files']), 'files, grid', d['grid'], '%.0f ms' % d['export_ms'])"
          python3 tools/check_export_alignment.py "$RUNNER_TEMP/export"
          # the same song with 0.6 s of music before bar 1: a bar is prepended, bar 2 starts on the downbeat
          python3 - "$RUNNER_TEMP/pickup.wav" <<'PY'
          import sys, wave
          src = wave.open("tests/fixtures/house_124_Amin.wav", "rb"); p = src.getparams(); f = src.readframes(src.getnframes())
          n = int(0.6 * p.framerate) * p.sampwidth * p.nchannels
          out = wave.open(sys.argv[1], "wb"); out.setparams(p); out.writeframes(f[-n:] + f); out.close()
          PY
          "$CLI" export "$RUNNER_TEMP/pickup.wav" --style house --out "$RUNNER_TEMP/export-pickup" \
            | python3 -c "import json,sys; g=json.load(sys.stdin)['grid']; print(g); sys.exit(0 if abs(g['first_downbeat_beat'] - 4.0) < 1e-6 else 1)"
          python3 tools/check_export_alignment.py "$RUNNER_TEMP/export-pickup"

      - name: Live capture (sources; capture == import for WAV and AAC; a system-audio attempt)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          "$CLI" capture --list-sources | python3 -c "import json,sys; d=json.load(sys.stdin); print('system audio:', d['system_audio_available'], '|', len(d['sources']), 'sources |', d['error'] or ''); sys.exit(0 if d['system_audio_available'] else 1)"
          # the acceptance: a capture stream of a file's samples analyses exactly like importing the file
          "$CLI" capture --simulate tests/fixtures/house_124_Amin.wav --speed 40 | tee "$RUNNER_TEMP/sim-wav.json"
          afconvert -f m4af -d aac -b 192000 tests/fixtures/house_124_Amin.wav "$RUNNER_TEMP/house.m4a"
          "$CLI" capture --simulate "$RUNNER_TEMP/house.m4a" --speed 40 | tee "$RUNNER_TEMP/sim-aac.json"
          python3 -c "import json; [print(f, json.load(open(f))['identical_buffer'], json.load(open(f))['identical_analysis']) for f in ['$RUNNER_TEMP/sim-wav.json', '$RUNNER_TEMP/sim-aac.json']]"
          # a real system-audio capture needs the Screen & System Audio Recording permission, which a CI
          # runner does not grant: this shows the error path (diagnostic, not a failure)
          "$CLI" capture --source system --seconds 2 --out "$RUNNER_TEMP/system.wav" || true

      - name: VST3 hosting (out-of-process scan, the test plugin on the chords channel, project persistence)
        run: |
          CLI=build/tools/cli/app-cli_artefacts/Release/app-cli
          LIST="$RUNNER_TEMP/plugins.xml"
          PLUGDIR="build/tests/plugins/TestSynth/JAudiosTestSynth_artefacts/Release/VST3"
          "$CLI" plugins scan --path "$PLUGDIR" --plugin-list "$LIST" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['found'], d['failed'], '%.0f ms' % d['scan_ms']); sys.exit(0 if len(d['found']) == 1 and d['found'][0]['instrument'] else 1)"
          "$CLI" plugins list --plugin-list "$LIST"
          # run 1: the plugin plays the chords with octave -1, gain 0.4; the project file keeps it
          "$CLI" audition tests/fixtures/house_124_Amin.wav --chords-plugin "JAudios Test Synth" --chords-param Octave=0.25 --chords-param Gain=0.4 \
              --plugin-list "$LIST" --save-project "$RUNNER_TEMP/song.json" --out "$RUNNER_TEMP/plugin1.wav" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); c=d['chords_instrument']; print(c); sys.exit(0 if c['parameters']['Octave'] == '-1' and 0.05 < d['peak'] < 1.0 else 1)"
          # run 2 (a new process = a restart): everything comes back from the project file
          "$CLI" audition tests/fixtures/house_124_Amin.wav --project "$RUNNER_TEMP/song.json" --plugin-list "$LIST" --out "$RUNNER_TEMP/plugin2.wav" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); c=d['chords_instrument']; print(c); sys.exit(0 if c['parameters'] == {'Gain': '0.40', 'Octave': '-1', 'Bypass': 'Off'} else 1)"
          cmp "$RUNNER_TEMP/plugin1.wav" "$RUNNER_TEMP/plugin2.wav" && echo "restored render is bit-identical"

      - name: Package (DMG; Developer ID signed + notarised when the signing secrets are set, else ad-hoc)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: tools/package_macos.sh --build-dir build --models build/models --out "$RUNNER_TEMP/dist" | tee "$RUNNER_TEMP/package.json"

      - name: Smoke test the packaged app (copied out of the DMG, bundled models only)
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach "$RUNNER_TEMP"/dist/JAudios-*.dmg -nobrowse -readonly -mountpoint "$MNT"
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/home"
          ditto "$MNT/JAudios.app" "$RUNNER_TEMP/Applications/JAudios.app"
          hdiutil detach "$MNT"
          APP="$RUNNER_TEMP/Applications/JAudios.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -c disable-library-validation
          # a fresh HOME: no ~/Library/Application Support models; outside the build tree: no dev paths
          HOME="$RUNNER_TEMP/home" "$APP/Contents/MacOS/JAudios" --self-test tests/fixtures/house_124_Amin.wav | tee "$RUNNER_TEMP/selftest.json"
          python3 - "$RUNNER_TEMP/selftest.json" "$APP" <<'PY'
          import json, sys
          r, app = json.load(open(sys.argv[1])), sys.argv[2]
          inside = lambda p: isinstance(p, str) and p.startswith(app + "/Contents/")
          problems = [m for m, p in r["models"].items() if p is not None and not inside(p)]
          problems += [] if inside(r["plugin_scanner"]) else ["plugin scanner outside the bundle"]
          problems += [] if r["ok"] else ["self-test not ok"]
          print(f"{r['song'].get('key')} ({r['song'].get('camelot')}), {r['song'].get('bpm', 0):.1f} BPM, {r['song'].get('progression')} in {r['song'].get('seconds', 0):.1f} s; models: {sorted(m for m, p in r['models'].items() if p)}")
          sys.exit("; ".join(problems) if problems else 0)
          PY

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: jaudios-macos
          path: |
            ${{ runner.temp }}/dist/JAudios-*.dmg
            ${{ runner.temp }}/dist/JAudios-*.dmg.sha256
          if-no-files-found: error

      - name: Stem separation with the CoreML execution provider (diagnostic)
        continue-on-error: true
        run: |
          JAUDIOS_ONNX_COREML=1 JAUDIOS_LOG_LEVEL=debug build/tools/cli/app-cli_artefacts/Release/app-cli separate tests/fixtures/loop_8bar_Gmaj.wav --no-cache --out "$RUNNER_TEMP/stems-coreml" | head -20

      - name: Realtime check
        run: tools/rt_check.sh

      - name: Probe library combinations (diagnostic)
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          "$ML_VENV/bin/python" ml/export_openkeyscan.py --stage torch "$RUNNER_TEMP/raw.onnx" "$RUNNER_TEMP/refs.npz" tests/fixtures/loop_8bar_Gmaj.wav || echo "::warning::torch stage failed"
          RAW="$RUNNER_TEMP/raw.onnx"; [ -f "$RAW" ] || RAW=build/models/openkeyscan3.onnx
          "$ML_VENV/bin/python" ml/tests/export_probe.py "$RAW" build/models/openkeyscan3.onnx

      - name: Export on macOS and load it in the app
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          MAC="$RUNNER_TEMP/mac-build"
          "$ML_VENV/bin/python" ml/export_openkeyscan.py --out "$MAC/models/openkeyscan3.onnx" tests/fixtures/*.wav
          cat "$MAC/models/openkeyscan3.onnx.provenance.json"
          python3 tools/models.py --only onnx --build-dir "$MAC"
          OUT=$(JAUDIOS_MODELS_DIR="$MAC/models" build/tools/cli/app-cli_artefacts/Release/app-cli analyze tests/fixtures/house_124_Amin.wav)
          echo "$OUT" | python3 -c "import json,sys; k=json.load(sys.stdin)['key']; print('backend', k['backend'], k['camelot'], k.get('warning','')); sys.exit(0 if k['backend']=='onnx' else 1)"

  release:
    name: GitHub release (tags v*)
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jaudios-macos
          path: dist
      - name: Create the release with the DMG and its sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "JAudios ${GITHUB_REF_NAME#v}" \
            --notes "macOS (Apple Silicon). Verify the download: shasum -a 256 -c JAudios-*.dmg.sha256"
